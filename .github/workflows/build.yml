name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-macos:
    needs: test
    runs-on: macos-latest
    env:
      # Exposed at job level so the step `if:` conditions can read them.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # When a Developer ID cert is configured, electron-builder signs the app
      # automatically (CSC_LINK/CSC_KEY_PASSWORD) and notarizes it with the
      # Apple credentials in env.
      - name: Build macOS DMG (signed + notarized)
        if: ${{ env.CSC_LINK != '' }}
        run: npx electron-builder --mac --publish never --config.mac.notarize=true

      # Fallback for forks / runs without signing secrets: unsigned build.
      # Unsigned artifacts trigger Gatekeeper warnings and are NOT for release.
      - name: Build macOS DMG (unsigned)
        if: ${{ env.CSC_LINK == '' }}
        run: npx electron-builder --mac --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    needs: build-macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macos-build/*
          generate_release_notes: true
