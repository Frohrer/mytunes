name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Deliberately NOT exposed as job-level env. An absent secret expands to
      # the empty string rather than being unset, and electron-builder treats a
      # defined-but-empty CSC_LINK as a certificate *path* — it resolves to the
      # workspace dir and fails with "<workspace> not a file". So the signing
      # vars are set only on the step that actually signs.
      - name: Detect signing credentials
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No CSC_LINK secret — building unsigned." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build macOS DMG (signed + notarized)
        if: steps.signing.outputs.available == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish never --config.mac.notarize=true

      # Unsigned fallback. CSC_IDENTITY_AUTO_DISCOVERY=false stops
      # electron-builder from scanning the runner keychain for an identity it
      # will not find; without it the build warns and can still try to sign.
      - name: Build macOS DMG (unsigned)
        if: steps.signing.outputs.available != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    needs: build-macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macos-build/*
          generate_release_notes: true
